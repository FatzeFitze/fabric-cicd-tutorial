# Merge the two items below into items in your existing release mask.
items:
  validation:
    role: code
    type: Notebook
    name: validate_release
    bindings: {default_lakehouse: lakehouse}
  # Use the graph key model here. definition.pbir also needs a sibling-relative
  # path to the sales_model.SemanticModel folder in the Reporting repo.
  returns_report:
    role: reports
    type: Report
    name: returns_overview
    bindings: {semantic_model: model}

# Replace the existing project_checks mapping with this mapping.
# The starter loads checks/validate_candidate.py and calls run(repositories, plan).
project_checks:
  static: checks.validate_candidate
