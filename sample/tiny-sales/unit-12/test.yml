# Keep this at the registered Test pipeline path to reuse its permissions.
trigger: none

# The queue option controls the write step. Both modes run live preflight.
parameters:
  - name: deployToTest
    displayName: Publish to Test after preflight
    type: boolean
    default: false

resources:
  # Keep these aliases for checkout.yml. Enter the Azure Repos names from the
  # mask. Python selects the exact commits from the branches fetched here.
  repositories:
    - repository: data
      type: git
      name: REPLACE_WITH_DATA_REPO
      ref: refs/heads/dev
    - repository: reports
      type: git
      name: REPLACE_WITH_REPORTING_REPO
      ref: refs/heads/dev

extends:
  template: /deployment_starter/templates/release.yml
  parameters:
    target: test
    deploy: ${{ parameters.deployToTest }}
    mask: config/tiny-sales-release.yml
