# Keep this at the registered Notebook CI path. The existing branch policy queues it.
trigger: none

resources:
  # Keep these aliases for checkout.yml. Enter the Azure Repos names from the
  # mask. Python selects the exact commits from the branches fetched here.
  repositories:
    - repository: data
      type: git
      name: REPLACE_WITH_DATA_REPO
      ref: refs/heads/dev
    - repository: reports
      type: git
      name: REPLACE_WITH_REPORTING_REPO
      ref: refs/heads/dev

extends:
  template: /deployment_starter/templates/ci.yml
  parameters:
    mask: config/tiny-sales-release.yml
