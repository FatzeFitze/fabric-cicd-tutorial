# The Prod wrapper runs from Code main and consumes the selected Test publish.
trigger: none

resources:
  # Keep these aliases for checkout.yml. Enter the Azure Repos names from the
  # mask. Python selects the exact commits from the branches fetched here.
  repositories:
    - repository: data
      type: git
      name: REPLACE_WITH_DATA_REPO
      ref: refs/heads/dev
    - repository: reports
      type: git
      name: REPLACE_WITH_REPORTING_REPO
      ref: refs/heads/dev
  # Match source to the registered Test pipeline name. The template uses
  # tested to locate the selected run's branch, commit and artifact.
  pipelines:
    - pipeline: tested
      source: Tiny Sales - Test Release
      trigger: none

extends:
  template: /deployment_starter/templates/release.yml
  parameters:
    target: prod
    deploy: true
    mask: config/tiny-sales-release.yml
