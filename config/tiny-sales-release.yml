version: 1

# Use repo-relative item folders. A dot means the root of that repo.
# CI supplies the Code revision. The other repos use full commit pins.
sources:
  code: {folder: '.', revision: checkout}
  data: {repository: 'REPLACE_DATA_REPO', folder: '.', revision: 'REPLACE_DATA_COMMIT'}
  reports: {repository: 'REPLACE_REPORTING_REPO', folder: '.', revision: 'REPLACE_REPORTING_COMMIT'}

# Item keys are local names for the plan. Bindings refer to these keys.
items:
  lakehouse: {role: data, type: Lakehouse, name: sales}
  library: {role: code, type: VariableLibrary, name: sales_config}
  notebook:
    role: code
    type: Notebook
    name: build_sales
    bindings: {default_lakehouse: lakehouse}
  pipeline:
    role: code
    type: DataPipeline
    name: run_sales
    bindings: {notebook: notebook, variables: library}
  model:
    role: reports
    type: SemanticModel
    name: sales_model
    bindings: {sql_analytics_endpoint_of: lakehouse}
    # The pipeline must prepare the table before the reporting items use it.
    after: [pipeline]
  report:
    role: reports
    type: Report
    name: sales_overview
    bindings: {semantic_model: model}

# The library folder is relative to sources.code.folder.
variable_library:
  item: library
  folder: sales_config.VariableLibrary
  environment_variable: environment_name

# The preview lists this check. The existing CI step runs it.
project_checks:
  notebook_source: checks.validate_tiny_sales

# Assign each role to its own workspace in each environment.
# value_set describes the selection the release should verify in Fabric.
environments:
  dev:
    workspaces:
      code: 'REPLACE_CODE_DEV_ID'
      data: 'REPLACE_DATA_DEV_ID'
      reports: 'REPLACE_REPORTING_DEV_ID'
    value_set: Default
  test:
    workspaces:
      code: 'REPLACE_CODE_TEST_ID'
      data: 'REPLACE_DATA_TEST_ID'
      reports: 'REPLACE_REPORTING_TEST_ID'
    value_set: Test
  prod:
    workspaces:
      code: 'REPLACE_CODE_PROD_ID'
      data: 'REPLACE_DATA_PROD_ID'
      reports: 'REPLACE_REPORTING_PROD_ID'
    value_set: Prod
