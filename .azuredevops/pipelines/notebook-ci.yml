trigger: none

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: '3.12'

  - bash: python -B -m checks.validate_tiny_sales --item-dir "$NOTEBOOK_ITEM_DIR"
    displayName: Validate Tiny Sales notebook source
    workingDirectory: $(Build.SourcesDirectory)
    env:
      NOTEBOOK_ITEM_DIR: 'build_sales.Notebook'
