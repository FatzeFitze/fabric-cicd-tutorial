trigger: none

variables:
  - template: /config/environments/dev.yml

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: DevPreflight
    displayName: Check the shared Dev targets
    # Use the merged configuration from dev for authenticated checks.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        displayName: Use Python 3.12
        inputs:
          versionSpec: '3.12'

      - bash: python -m pip install --disable-pip-version-check -r toolkit/requirements-planning.txt
        displayName: Install the planner dependency
        workingDirectory: $(Build.SourcesDirectory)

      - task: AzureCLI@2
        displayName: Read Dev workspace and item identities
        inputs:
          # Resolve the connection name before Azure DevOps authorizes the task.
          azureSubscription: ${{ variables.releaseServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: $(Build.SourcesDirectory)
          visibleAzLogin: false
          inlineScript: |
            set -e
            python -B -m toolkit.fabric_preflight \
              --mask config/tiny-sales-release.yml \
              --environment-config config/environments/dev.yml \
              --checkout-revision "$CHECKOUT_REVISION"
        env:
          CHECKOUT_REVISION: $(Build.SourceVersion)
